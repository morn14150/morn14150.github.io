<!DOCTYPE html>
<html>
<head>
  <title>Other cool stuff</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/style2.css">
  <style>
    .platform-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .platform-left {
      display: flex;
      flex-direction: column;
    }

    .platform-left h3, .platform-left p, .platform-left small {
      margin: 0;
    }
    
    .platform-right p {
      margin: 0;
    }

    .platform-left small {
      margin-top: 5px;
    }

    /* MOBILE LAYOUT */
    @media (max-width: 600px) {
      .platform-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .platform-right a {
        overflow-wrap: break-word; 
      }
    }
  </style>
</head>
<body>
<h2><a href="/">Return</a></h2>
<h1>Other cool stuff</h1>
<h5>Just some things that I think is cool.</h5>

<hr>

<div class="platform-row">
  <div class="platform-left">
    <h3>corrscope</h3>
    <small>Oscilloscope audio visualizer</small>
  </div>
  <div class="platform-right">
    <p><a href="https://github.com/corrscope/corrscope">https://github.com/corrscope/corrscope</a></p>
  </div>
</div>

<div class="platform-row">
  <div class="platform-left">
    <h3>BasicPitch</h3>
    <small>audio-to-MIDI converter</small>
  </div>
  <div class="platform-right">
    <p><a href="https://basicpitch.spotify.com/">https://basicpitch.spotify.com/</a></p>
  </div>
</div>

<div class="platform-row">
  <div class="platform-left">
    <h3>musictheory.net</h3>
  </div>
  <div class="platform-right">
    <p><a href="https://www.musictheory.net/">https://www.musictheory.net/</a></p>
  </div>
</div>

</body>
</html>
