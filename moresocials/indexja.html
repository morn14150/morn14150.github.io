<!DOCTYPE html>
<html>
<head>
  <title>その他のソーシャルメディア</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/style2.css">
  <style>
    .site-banner {
      width: 100%;
      max-width: 800px;
      height: auto;
      display: block;
      margin: 0 auto 20px auto;
      border-radius: 4px;
    }

    .platform-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .platform-left {
      display: flex;
      flex-direction: column;
    }

    .platform-left h3, .platform-left p, .platform-left small {
      margin: 0;
    }
    
    .platform-left small {
      margin-top: 5px;
    }
    
    .platform-right p {
      margin: 0;
    }

    .platform-left h3, .platform-left h5, .platform-left p, .platform-left small {
      margin: 0;
    }
    
    .platform-right p, .platform-right h5 {
      margin: 0;
    }

    /* MOBILE LAYOUT */
    @media (max-width: 600px) {
      .platform-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .platform-right a {
        overflow-wrap: break-word; 
      }
    }
  </style>
</head>
<body>

<img src="/image/banner.png" alt="sinerack-banner" class="site-banner">

<h2><a href="/indexja.html">戻る</a></h2>
<h5>これには、活動が極めて少ない、あるいは放置されているソーシャルメディアサービスが含まれます。</h5>

<hr>

<div class="platform-row">
  <div class="platform-left">
    <h3>SoundCloud</h3>
    <small>(新しい楽曲はリリースされません)</small>
  </div>
  <div class="platform-right">
    <p><a href="https://soundcloud.com/sinerack">https://soundcloud.com/sinerack</a></p>
  </div>
</div>

<div class="platform-row">
  <div class="platform-left">
    <h3>Spotifyプロフィール</h3>
  </div>
  <div class="platform-right">
    <p><a href="https://open.spotify.com/user/31sbto4sfim5dhsg4rjrdg7rmh5m">https://open.spotify.com/user/31sbto4sfim5dhsg4rjrdg7rmh5m</a></p>
  </div>
</div>

<div class="platform-row">
  <div class="platform-left">
    <h3>Roblox</h3>
    <small>(今どき、一体誰が遊んでるんだ？)</small>
  </div>
  <div class="platform-right">
    <p><a href="https://www.roblox.com/users/424122569/profile">https://www.roblox.com/users/424122569/profile</a></p>
  </div>
</div>

</body>
</html>
